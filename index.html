<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>智勤选点</title>
<link rel="stylesheet" href="https://cdn.staticfile.org/leaflet/1.9.4/leaflet.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, "PingFang SC", sans-serif; }
  #map { height: 55vh; }
  #baseSel { position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; gap: 4px; }
  #baseSel button { flex: 0 0 auto; padding: 5px 8px; font-size: 11px; background: rgba(255,255,255,.92); color: #333; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  #baseSel button.on { background: #007aff; color: #fff; }
  .panel { padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); background: #f7f7f7; }
  .picked { font-size: 13px; color: #333; margin-bottom: 8px; word-break: break-all; }
  .picked b { color: #007aff; }
  input[type=text] { width: 100%; padding: 9px 10px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 14px; margin-bottom: 8px; background: #fff; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .row input { flex: 1; margin-bottom: 0; }
  .btns { display: flex; gap: 8px; margin-bottom: 8px; }
  button { flex: 1; padding: 10px 6px; border: none; border-radius: 8px; font-size: 14px; background: #007aff; color: #fff; }
  button.ghost { background: #e8f0ff; color: #007aff; }
  button.warn { background: #ff5a5a; }
  button.mini { flex: 0 0 auto; padding: 6px 10px; font-size: 12px; }
  #status { font-size: 13px; margin: 6px 0; min-height: 18px; word-break: break-all; }
  #status.ok { color: #34a853; }
  #status.err { color: #e8433f; }
  .fav-item { display: flex; align-items: center; gap: 6px; padding: 8px; background: #fff; border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
  .fav-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hint { font-size: 11px; color: #999; margin-top: 8px; line-height: 1.5; }
  .sect { font-size: 12px; color: #666; margin: 10px 0 6px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="baseSel">
  <button data-b="street" class="on">街道</button>
  <button data-b="sat">卫星</button>
  <button data-b="voyager">浅图</button>
  <button data-b="osm">OSM</button>
</div>
<div class="panel">
  <div class="picked" id="picked">点击地图选择位置，或搜索/粘贴链接</div>
  <div class="row">
    <input type="text" id="search" placeholder="搜索地名，如：南莲路53号">
    <button id="btnSearch" class="ghost mini">搜索</button>
  </div>
  <input type="text" id="locName" placeholder="地点名称（选点后自动反查，可修改）">
  <div class="btns">
    <button id="btnSave">储存到设备</button>
    <button id="btnQuery" class="ghost">查询当前生效</button>
  </div>
  <input type="text" id="paste" placeholder="粘贴高德/苹果链接、短链、高德拾取器坐标，或 纬度,经度">
  <div class="btns">
    <button id="btnParse" class="ghost">解析定位</button>
    <button id="btnDefault" class="ghost">用默认位置</button>
  </div>
  <div class="btns">
    <button id="btnJitter" class="ghost">重置抖动</button>
    <button id="btnClear" class="warn">清除选点(恢复默认)</button>
  </div>
  <div id="status"></div>
  <div class="sect">中文地址反查（选点后自动填入地点名称；默认 OSM，填高德 Key 更准）</div>
  <div class="row">
    <input type="text" id="amapKey" placeholder="高德 Web服务 Key（可选，申请步骤见 README）">
    <button id="btnAmapKey" class="ghost mini">保存</button>
  </div>
  <div class="sect">链接解析 Worker（解析高德短链用，部署见 README，可留空）</div>
  <div class="row">
    <input type="text" id="workerUrl" placeholder="https://你的worker地址.workers.dev">
    <button id="btnWorker" class="ghost mini">保存</button>
  </div>
  <div class="btns"><button id="btnFav" class="ghost">收藏当前点</button></div>
  <div id="favList"></div>
  <div class="hint">官方说明：地图采用 WGS-84 坐标系，</div>
</div>
<script src="https://cdn.staticfile.org/leaflet/1.9.4/leaflet.min.js"></script>
<script>
var SAVE_URL = "https://proj-kq.ruioutech.com/zqb-settings/save";
var DEF_LAT = 28.622877368112636, DEF_LON = 115.91757960765315;

// 考勤系统采用 WGS-84 坐标系（官方说明：考勤地图采用 WGS84 坐标系，
// 若出现偏差可参考经纬度获取与转换方法，如高德坐标拾取器 lbs.amap.com/tools/picker）：
// picked / 收藏 / 生效坐标 / 保存值 全部以 WGS-84 存储
// GCJ 底图（高德街道图）仅作显示，点选与标记时自动换算
var map = null, marker = null, effMarker = null, picked = null;
var curBase = "street", baseLayer = null;

// ---------- 坐标系转换 WGS-84 <-> GCJ-02（国标通用公式） ----------
function outOfChina(lat, lng) { return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271; }
function tLat(x, y) {
  var r = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
  r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
  r += (20 * Math.sin(y * Math.PI) + 40 * Math.sin(y / 3 * Math.PI)) * 2 / 3;
  r += (160 * Math.sin(y / 12 * Math.PI) + 320 * Math.sin(y * Math.PI / 30)) * 2 / 3;
  return r;
}
function tLng(x, y) {
  var r = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
  r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
  r += (20 * Math.sin(x * Math.PI) + 40 * Math.sin(x / 3 * Math.PI)) * 2 / 3;
  r += (150 * Math.sin(x / 12 * Math.PI) + 300 * Math.sin(x / 30 * Math.PI)) * 2 / 3;
  return r;
}
function wgs2gcj(lat, lng) {
  if (outOfChina(lat, lng)) return { lat: lat, lng: lng };
  var a = 6378245.0, ee = 0.00669342162296594323;
  var dLat = tLat(lng - 105, lat - 35), dLng = tLng(lng - 105, lat - 35);
  var radLat = lat / 180 * Math.PI, magic = 1 - ee * Math.sin(radLat) * Math.sin(radLat);
  var sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
  dLng = (dLng * 180) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
  return { lat: lat + dLat, lng: lng + dLng };
}
function gcj2wgs(lat, lng) { // 一次近似逆推，显示用途足够（误差<1米）
  var g = wgs2gcj(lat, lng);
  return { lat: lat * 2 - g.lat, lng: lng * 2 - g.lng };
}

// ---------- 底图（2026-10 二次校准） ----------
// 坐标系事实：考勤系统=WGS-84。高德全系图源——矢量街道(style=7)、卫星影像(style=6)、
// 路网(style=8)——均为 GCJ-02 加偏（此前"卫星影像未加偏"的判断有误，实测卫星图偏移约600米）。
// 凡 cs="gcj" 的底图（街道/卫星）显示与点选均自动转换；浅图/OSM 为 WGS-84 图源，直接显示。
// 浅图换用 ArcGIS World Light Gray（无 Key、国内通常可直连；Carto 源部分网络下无法出图）。
var BASES = {
  street: { cs: "gcj", url: "https://wprd0{s}.is.autonavi.com/appmaptile?x={x}&y={y}&z={z}&lang=zh_cn&size=1&scl=1&style=7", sub: "1234", max: 18 },
  sat: { cs: "gcj", url: "https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}", sub: "1234", max: 18 },
  voyager: { cs: "wgs", url: "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", sub: "1234", max: 19, nm: 16 },
  osm: { cs: "wgs", url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", sub: "abc", max: 19 }
};
// WGS(数据) -> 当前底图显示坐标
function dPt(lat, lng) { return BASES[curBase].cs === "gcj" ? wgs2gcj(lat, lng) : { lat: lat, lng: lng }; }

function setBase(key) {
  if (!map) return;
  if (baseLayer) { map.removeLayer(baseLayer); baseLayer = null; }
  curBase = key;
  var b = BASES[key];
  baseLayer = L.tileLayer(b.url, { subdomains: b.sub, maxZoom: b.max, maxNativeZoom: b.nm || b.max, attribution: key });
  var tileErr = 0;
  baseLayer.on("tileerror", function () {
    if (++tileErr === 3) status("当前地图源加载失败，可切换右上角其他地图源；储存/查询不受影响", "err");
  });
  baseLayer.addTo(map);
  var btns = document.querySelectorAll("#baseSel button");
  for (var i = 0; i < btns.length; i++) btns[i].className = btns[i].getAttribute("data-b") === key ? "on" : "";
  refreshMarkers();
}

function initMap() {
  if (typeof L === "undefined") {
    document.getElementById("map").innerHTML =
      '<div style="padding:20px;color:#e8433f;font-size:13px;">地图库(Leaflet)加载失败，可能是网络问题；<br>搜索、粘贴坐标、储存、查询等功能仍可正常使用。</div>';
    return;
  }
  var d = dPt(DEF_LAT, DEF_LON);
  map = L.map("map").setView([d.lat, d.lng], 16);
  map.on("click", function (e) {
    var p = BASES[curBase].cs === "gcj" ? gcj2wgs(e.latlng.lat, e.latlng.lng) : { lat: e.latlng.lat, lng: e.latlng.lng };
    setPicked(p.lat, p.lng, false);
  });
  setBase("street");
}

function refreshMarkers() {
  if (!map) return;
  if (marker && picked) {
    var d = dPt(picked.lat, picked.lng);
    marker.setLatLng([d.lat, d.lng]);
  }
  if (effMarker && effMarker._zqb_wgs) {
    var g = effMarker._zqb_wgs, d2 = dPt(g.lat, g.lng);
    effMarker.setLatLng([d2.lat, d2.lng]);
  }
}

function setPicked(lat, lng, fly) {
  picked = { lat: lat, lng: lng };
  // 高德拾取器对照值：官方建议用高德网址查坐标（GCJ-02），并列显示便于核对
  var g = wgs2gcj(lat, lng);
  document.getElementById("picked").innerHTML =
    "已选中（WGS-84）：<b>" + lat.toFixed(10) + ", " + lng.toFixed(10) + "</b><br>" +
    "高德对照（GCJ-02）：" + g.lat.toFixed(6) + ", " + g.lng.toFixed(6);
  if (map) {
    var d = dPt(lat, lng);
    if (marker) marker.remove();
    marker = L.marker([d.lat, d.lng]).addTo(map);
    if (fly) map.flyTo([d.lat, d.lng], Math.max(map.getZoom(), 16));
  }
  tryAutoName(lat, lng);
}

function status(msg, cls) {
  var el = document.getElementById("status");
  el.textContent = msg;
  el.className = cls || "";
}
function api(qs) {
  status("请求中…");
  return fetch(SAVE_URL + "?" + qs)
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var j;
      try { j = JSON.parse(t); } catch (e) { throw new Error("返回非 JSON（拦截未生效或证书未信任）"); }
      return j;
    })
    .catch(function () { throw new Error("请求失败：请确认小火箭已开代理且已信任证书"); });
}

document.getElementById("btnSave").onclick = function () {
  if (!picked) { status("请先在地图上选点、搜索或粘贴链接", "err"); return; }
  var nameEl = document.getElementById("locName");
  var name = nameEl.value.trim();
  var doSave = function () {
    var qs = "lon=" + picked.lng + "&lat=" + picked.lat + (name ? "&loc=" + encodeURIComponent(name) : "");
    api(qs).then(function (j) {
      if (j.success) status("✅ 已保存，下次打卡生效", "ok");
      else status("❌ " + (j.error || "保存失败"), "err");
    }).catch(function (e) { status("❌ " + e.message, "err"); });
  };
  // 确认选点：名称为空或仍是自动填的值时，用最终坐标强制反查一次中文地址，保证名称与坐标精确对应
  if (!name || name === autoName) {
    status("正在通过坐标反查中文地址…");
    forceAutoName(picked.lat, picked.lng).then(function (s) {
      if (s && (!name || name === autoName)) { nameEl.value = s; autoName = s; name = s; }
      if (!name && !confirm("未能获取地址且未填写名称：打卡记录将显示默认地址「南莲路53号附近」，与所选坐标不一致。\n确定不填名称、继续保存吗？")) return;
      doSave();
    });
    return;
  }
  doSave();
};

function showEffective(lat, lng, label) {
  if (!map) { status(label, "ok"); return; }
  if (effMarker) effMarker.remove();
  var d = dPt(lat, lng);
  effMarker = L.circleMarker([d.lat, d.lng], { radius: 10, color: "#007aff", fillColor: "#007aff", fillOpacity: 0.4 })
    .addTo(map).bindPopup(label);
  effMarker._zqb_wgs = { lat: lat, lng: lng };
  map.flyTo([d.lat, d.lng], Math.max(map.getZoom(), 16));
}

document.getElementById("btnQuery").onclick = function () {
  api("action=query").then(function (j) {
    if (j.settings) {
      showEffective(j.settings.latitude, j.settings.longitude, "当前生效：手动选点 " + (j.settings.location || ""));
      status("当前模式：手动选点 " + j.settings.latitude + ", " + j.settings.longitude + "（WGS-84）", "ok");
    } else {
      showEffective(DEF_LAT, DEF_LON, "当前生效：默认配置（南莲路53号）");
      status("当前模式：默认配置（南莲路53号）", "ok");
    }
  }).catch(function (e) { status("❌ " + e.message, "err"); });
};

document.getElementById("btnClear").onclick = function () {
  api("action=clear").then(function (j) { status("✅ " + j.message, "ok"); })
    .catch(function (e) { status("❌ " + e.message, "err"); });
};
document.getElementById("btnJitter").onclick = function () {
  api("action=jitter").then(function (j) { status("✅ " + j.message, "ok"); })
    .catch(function (e) { status("❌ " + e.message, "err"); });
};
document.getElementById("btnDefault").onclick = function () {
  setPicked(DEF_LAT, DEF_LON, true);
};

// ---------- 地名搜索（nominatim 返回 WGS-84，与考勤系统一致，直接使用） ----------
function searchPlace() {
  var q = document.getElementById("search").value.trim();
  if (!q) { status("请输入地名", "err"); return; }
  status("搜索中…");
  fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=zh-CN&q=" + encodeURIComponent(q))
    .then(function (r) { return r.json(); })
    .then(function (rs) {
      if (!rs || !rs.length) { status("未找到：" + q, "err"); return; }
      setPicked(parseFloat(rs[0].lat), parseFloat(rs[0].lon), true);
      status("已定位（WGS-84）：" + (rs[0].display_name || "").slice(0, 40), "ok");
    })
    .catch(function () { status("搜索失败（网络）", "err"); });
}
document.getElementById("btnSearch").onclick = searchPlace;
document.getElementById("search").addEventListener("keydown", function (e) { if (e.key === "Enter") searchPlace(); });

// ---------- 逆地理编码：选点后自动获取中文地址，填入地点名称（可手动修改） ----------
// 默认用 OSM Nominatim（免 Key）；配置高德 Web服务 Key 后改用高德（地址更准、格式与考勤记录一致）
// 高德接口只认 GCJ-02，查询前先 wgs2gcj 转换；Nominatim 直接用 WGS-84
var autoName = "", lastGeoTs = 0, geoTimer = null;
function getAmapKey() { try { return (localStorage.getItem("zqb_amapkey") || "").trim(); } catch (e) { return ""; } }
function fillName(s) {
  var el = document.getElementById("locName");
  var cur = el.value.trim();
  // 仅当为空或仍是上次自动填的值时覆盖，绝不覆盖手动输入
  if (cur === "" || cur === autoName) {
    el.value = s; autoName = s;
    status("已自动填入地点名称：" + s + "（可修改）", "ok");
  }
}
function geoQuery(lat, lng) {
  var key = getAmapKey();
  if (key) {
    var g = wgs2gcj(lat, lng);
    return fetch("https://restapi.amap.com/v3/geocode/regeo?output=json&extensions=base&key=" + encodeURIComponent(key) + "&location=" + g.lng.toFixed(6) + "," + g.lat.toFixed(6))
      .then(function (r) { return r.json(); })
      .then(function (j) { return (j && j.status === "1" && j.regeocode && j.regeocode.formatted_address) ? (j.regeocode.formatted_address + "附近") : null; })
      .catch(function () { return null; });
  }
  return fetch("https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&addressdetails=1&accept-language=zh-CN&lat=" + lat + "&lon=" + lng)
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.address) return null;
      var a = j.address, parts = [];
      if (a.state) parts.push(a.state);
      var c = a.city || a.town || a.county; if (c) parts.push(c);
      if (a.district || a.suburb) parts.push(a.district || a.suburb);
      if (a.road) parts.push(a.road);
      if (a.house_number) parts.push(a.house_number);
      return parts.length ? (parts.join("") + "附近") : null;
    })
    .catch(function () { return null; });
}
function tryAutoName(lat, lng) {
  // Nominatim 限速约 1次/秒：节流窗口内不丢弃请求，改为防抖——定时后用最终坐标补查一次
  var wait = 1200 - (Date.now() - lastGeoTs);
  if (wait > 0) {
    if (geoTimer) clearTimeout(geoTimer);
    geoTimer = setTimeout(function () { tryAutoName(lat, lng); }, wait + 50);
    return;
  }
  lastGeoTs = Date.now();
  geoQuery(lat, lng).then(function (s) { if (s) fillName(s); });
}
function forceAutoName(lat, lng) {
  // 确认选点时用最终坐标强制反查（绕过节流，单次手动频率对高德/Nominatim 均可承受）
  lastGeoTs = Date.now();
  return geoQuery(lat, lng);
}

// ---------- Worker 解析（高德短链 surl.amap.com 的坐标藏在 302 跳转里） ----------
function getWorker() { try { return (localStorage.getItem("zqb_worker") || "").trim(); } catch (e) { return ""; } }
function parseViaWorker(u) {
  var w = getWorker();
  if (!w) { status("高德短链需解析 Worker：在下方填入你部署的 Worker 地址（部署步骤见 README）", "err"); return; }
  status("正在通过 Worker 解析短链…");
  fetch(w.replace(/\/+$/, "") + "/parse?u=" + encodeURIComponent(u))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.error) { status("❌ Worker：" + j.error, "err"); return; }
      setPicked(j.lat, j.lon, true); // Worker 已统一转换为 WGS-84
      status("已解析短链（GCJ→WGS 已由 Worker 转换）", "ok");
    })
    .catch(function () { status("❌ Worker 请求失败（地址错误或网络问题）", "err"); });
}

// ---------- 粘贴解析：本地正则优先，未命中且为链接时走 Worker ----------
function parseInput() {
  var s = document.getElementById("paste").value.trim();
  if (!s) { status("请先粘贴内容", "err"); return; }
  // 高德: position=经度,纬度（含 uri.amap.com/marker 完整链，GCJ-02 → WGS-84）
  var m = s.match(/[?&]position=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  if (m) { var w1 = gcj2wgs(parseFloat(m[2]), parseFloat(m[1])); setPicked(w1.lat, w1.lng, true); status("已按高德链接定位（GCJ→WGS 已转换）", "ok"); return; }
  // 苹果: ll= 或 coordinate=纬度,经度（GCJ-02 → WGS-84）
  m = s.match(/[?&](?:ll|coordinate)=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  if (m) { var w2 = gcj2wgs(parseFloat(m[1]), parseFloat(m[2])); setPicked(w2.lat, w2.lng, true); status("已按苹果地图链接定位（GCJ→WGS 已转换）", "ok"); return; }
  // 裸坐标对（自动判断纬经顺序，按中国范围）
  m = s.match(/(-?\d+(?:\.\d+)?)\s*[,，]\s*(-?\d+(?:\.\d+)?)/);
  if (m) {
    var a = parseFloat(m[1]), b = parseFloat(m[2]);
    var isLat = function (v) { return v >= 18 && v <= 54; };
    var isLng = function (v) { return v >= 73 && v <= 136; };
    if (isLng(a) && isLat(b)) { var t = a; a = b; b = t; } // 输入是 经度,纬度 → 交换
    var w3 = gcj2wgs(a, b); // 考勤系统提示用高德网址查坐标，高德查询值为 GCJ-02，统一转 WGS-84
    setPicked(w3.lat, w3.lng, true);
    status("已按 GCJ-02（高德查询值）转换为 WGS-84 定位；若你粘贴的本身是 WGS-84 坐标，请改用地图点选", "ok");
    return;
  }
  // 其余链接（高德短链等）→ Worker 跟跳转解析
  if (/https?:\/\//i.test(s)) { parseViaWorker(s); return; }
  status("未识别出坐标（短链需配置解析 Worker，见 README）", "err");
}
document.getElementById("btnParse").onclick = parseInput;
document.getElementById("paste").addEventListener("keydown", function (e) { if (e.key === "Enter") parseInput(); });

// 全局粘贴监听：复制链接后切回本页自动填入并解析（参考 wloc 交互）
document.addEventListener("paste", function (e) {
  var text = (e.clipboardData || window.clipboardData).getData("text");
  if (!text) return;
  if (!(/https?:\/\//i.test(text) || /\d+\.\d+\s*[,，]/.test(text))) return;
  var input = document.getElementById("paste");
  if (e.target !== input) input.value = text;
  setTimeout(parseInput, 200);
});

// Worker 地址配置
document.getElementById("btnWorker").onclick = function () {
  var v = document.getElementById("workerUrl").value.trim().replace(/\/+$/, "");
  if (v && !/^https?:\/\//i.test(v)) { status("Worker 地址需以 http(s):// 开头", "err"); return; }
  try { localStorage.setItem("zqb_worker", v); } catch (e) {}
  status(v ? "✅ Worker 地址已保存" : "已清空 Worker 地址", "ok");
};
document.getElementById("workerUrl").value = getWorker();

// 高德 Key 配置（用于地址反查，可选）
document.getElementById("btnAmapKey").onclick = function () {
  var v = document.getElementById("amapKey").value.trim();
  try { localStorage.setItem("zqb_amapkey", v); } catch (e) {}
  status(v ? "✅ 已保存高德 Key，地址反查改用高德" : "已清空高德 Key，地址反查使用 OSM", "ok");
};
document.getElementById("amapKey").value = getAmapKey();

// 底图切换
document.querySelectorAll("#baseSel button").forEach(function (b) {
  b.onclick = function () { setBase(b.getAttribute("data-b")); };
});

// ---------- 收藏列表：存浏览器 localStorage；生效坐标存小火箭持久化 ----------
var FAV_KEY = "zqb_favs";
function getFavs() { try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch (e) { return []; } }
function setFavs(f) { localStorage.setItem(FAV_KEY, JSON.stringify(f)); renderFavs(); }
function renderFavs() {
  var box = document.getElementById("favList");
  box.innerHTML = "";
  getFavs().forEach(function (f, i) {
    var div = document.createElement("div");
    div.className = "fav-item";
    var nm = document.createElement("div");
    nm.className = "nm";
    nm.textContent = (f.name || "未命名") + "  " + f.lat.toFixed(5) + "," + f.lng.toFixed(5);
    var go = document.createElement("button");
    go.className = "mini ghost"; go.textContent = "定位";
    go.onclick = function () { setPicked(f.lat, f.lng, true); };
    var sv = document.createElement("button");
    sv.className = "mini"; sv.textContent = "储存";
    sv.onclick = function () {
      var qs = "lon=" + f.lng + "&lat=" + f.lat + (f.name ? "&loc=" + encodeURIComponent(f.name) : "");
      api(qs).then(function (j) {
        if (j.success) status("✅ 已储存「" + (f.name || "") + "」，下次打卡生效", "ok");
      }).catch(function (e) { status("❌ " + e.message, "err"); });
    };
    var del = document.createElement("button");
    del.className = "mini warn"; del.textContent = "×";
    del.onclick = function () { var fs = getFavs(); fs.splice(i, 1); setFavs(fs); };
    div.appendChild(nm); div.appendChild(go); div.appendChild(sv); div.appendChild(del);
    box.appendChild(div);
  });
}
document.getElementById("btnFav").onclick = function () {
  if (!picked) { status("请先选择位置", "err"); return; }
  var name = document.getElementById("locName").value.trim() || ("位置" + (getFavs().length + 1));
  var fs = getFavs();
  fs.push({ name: name, lat: picked.lat, lng: picked.lng });
  setFavs(fs);
  status("已收藏「" + name + "」", "ok");
};
initMap();
renderFavs();
</script>
